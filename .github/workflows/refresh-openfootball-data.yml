name: Refresh open football data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-turkey-squads:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout game repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download latest OpenFootballBase release
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/openfootballbase/extracted"
          curl --fail --location --retry 3 \
            https://github.com/florentfougeres/OpenFootballBase-Data/releases/latest/download/openfootballbase-data.tar.gz \
            --output "${RUNNER_TEMP}/openfootballbase/release.tar.gz"
          tar -xzf "${RUNNER_TEMP}/openfootballbase/release.tar.gz" -C "${RUNNER_TEMP}/openfootballbase/extracted"
      - name: Convert Turkey league squads to game JSON
        run: |
          python -m pip install --disable-pip-version-check duckdb
          python tools/convert_openfootballbase.py \
            --input "${RUNNER_TEMP}/openfootballbase/extracted" \
            --output data/openfootballbase/turkey_squads.json \
            --seasons 2024/25 2025/26 2026/27
      - name: Commit refreshed data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/openfootballbase/turkey_squads.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Refresh free Turkish club squad data"
            git push
          fi
