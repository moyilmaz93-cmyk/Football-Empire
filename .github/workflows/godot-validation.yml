name: Godot validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot 4
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false

      - name: Import project and build global class cache
        run: godot --headless --editor --path . --quit

      - name: Test player text parser
        run: godot --headless --path . --script tests/test_openfootball_player_parser.gd

      - name: Test squad entry model
        run: godot --headless --path . --script tests/test_squad_entry.gd

      - name: Test league data catalog
        run: godot --headless --path . --script tests/test_football_data_catalog.gd
